<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Results — SAT Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- MathJax config MUST be before the script -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$','$'],['\\(','\\)']],
        displayMath: [['$$','$$'],['\\[','\\]']]
      },
      svg: { fontCache: 'global' },
      startup: { typeset: false }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    :root {
      --blue:       #4f46e5;
      --blue-dark:  #3730a3;
      --blue-light: #eef2ff;
      --green:      #059669;
      --green-bg:   #ecfdf5;
      --red:        #dc2626;
      --red-bg:     #fef2f2;
      --orange:     #d97706;
      --orange-bg:  #fffbeb;
      --purple:     #7c3aed;
      --purple-bg:  #f5f3ff;
      --gray-50:    #f9fafb;
      --gray-100:   #f3f4f6;
      --gray-200:   #e5e7eb;
      --gray-300:   #d1d5db;
      --gray-400:   #9ca3af;
      --gray-500:   #6b7280;
      --gray-600:   #4b5563;
      --gray-700:   #374151;
      --gray-800:   #1f2937;
      --gray-900:   #111827;
      --font: 'Inter', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
    body { font-family: var(--font); background: #f1f5f9; color: var(--gray-900); min-height: 100vh; }

    /* ── Nav ── */
    .topnav {
      background: #fff; border-bottom: 1px solid var(--gray-200);
      padding: 0 32px; height: 64px; display: flex; align-items: center;
      justify-content: space-between; position: sticky; top: 0; z-index: 100;
      box-shadow: 0 1px 0 rgba(0,0,0,.05);
    }
    .nav-logo { display:flex; align-items:center; gap:10px; }
    .nav-logo-icon {
      width:36px; height:36px; border-radius:10px;
      background: linear-gradient(135deg,var(--blue),var(--purple));
      display:flex; align-items:center; justify-content:center;
      font-size:18px; box-shadow:0 4px 12px rgba(79,70,229,.4);
    }
    .nav-logo-text { font-weight:800; font-size:16px; }
    .nav-right { display:flex; align-items:center; gap:12px; }
    .nav-user { font-size:14px; font-weight:600; color:var(--gray-700); }
    .btn-back {
      padding: 8px 16px; border-radius: 9px; border: 1px solid var(--gray-200);
      background: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
      color: var(--gray-700); text-decoration: none; display: inline-flex;
      align-items: center; gap: 5px; transition: all .15s; font-family: var(--font);
    }
    .btn-back:hover { background: var(--gray-50); border-color: var(--gray-300); }

    /* ── Page ── */
    .page { max-width: 900px; margin: 0 auto; padding: 32px 24px 80px; }

    /* ── Hero Score ── */
    .score-hero {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 60%, #2563eb 100%);
      border-radius: 20px; padding: 40px; margin-bottom: 24px;
      color: #fff; position: relative; overflow: hidden;
      box-shadow: 0 12px 40px rgba(79,70,229,.4);
      animation: fadeUp .5s ease-out;
    }
    .score-hero::before {
      content: ''; position: absolute; top: -80px; right: -80px;
      width: 300px; height: 300px; border-radius: 50%;
      background: rgba(255,255,255,.06);
    }
    .score-hero::after {
      content: ''; position: absolute; bottom: -100px; left: 100px;
      width: 250px; height: 250px; border-radius: 50%;
      background: rgba(255,255,255,.04);
    }
    .hero-inner { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 32px; flex-wrap: wrap; }
    .hero-left .test-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: rgba(255,255,255,.6); margin-bottom: 10px; }
    .hero-left .test-name { font-size: 22px; font-weight: 800; margin-bottom: 6px; letter-spacing: -.3px; }
    .hero-left .meta-row { font-size: 13px; color: rgba(255,255,255,.7); display: flex; gap: 16px; flex-wrap: wrap; }
    .hero-center { text-align: center; }
    .score-ring {
      width: 140px; height: 140px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,.25);
      background: rgba(255,255,255,.1);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      backdrop-filter: blur(10px); margin: 0 auto 12px;
    }
    .score-num { font-size: 52px; font-weight: 900; line-height: 1; }
    .score-denom { font-size: 16px; color: rgba(255,255,255,.65); }
    .accuracy-text { font-size: 18px; font-weight: 700; }
    .grade-badge {
      display: inline-block; padding: 4px 16px; border-radius: 99px;
      font-size: 14px; font-weight: 800; margin-top: 4px;
      background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.25);
    }
    .hero-actions { display: flex; flex-direction: column; gap: 8px; }
    .btn-hero { padding: 11px 22px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; font-family: var(--font); transition: all .2s; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-hero-white { background: #fff; color: var(--blue); box-shadow: 0 4px 14px rgba(0,0,0,.15); }
    .btn-hero-white:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0,0,0,.2); }
    .btn-hero-outline { background: rgba(255,255,255,.12); color: #fff; border: 1.5px solid rgba(255,255,255,.3); }
    .btn-hero-outline:hover { background: rgba(255,255,255,.2); }

    /* ── Stats Row ── */
    .stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-bottom: 20px; animation: fadeUp .5s ease-out .1s backwards; }
    .stat-card {
      background: #fff; border: 1px solid var(--gray-200); border-radius: 16px;
      padding: 20px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.05);
      position: relative; overflow: hidden;
    }
    .stat-card::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; border-radius: 0 0 16px 16px; }
    .stat-card.correct::after  { background: var(--green); }
    .stat-card.incorrect::after{ background: var(--red); }
    .stat-card.skipped::after  { background: var(--gray-400); }
    .stat-val { font-size: 36px; font-weight: 900; line-height: 1; }
    .stat-lbl { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-top: 6px; color: var(--gray-400); }

    /* ── Breakdown ── */
    .breakdown-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; animation: fadeUp .5s ease-out .15s backwards; }
    .breakdown-card {
      background: #fff; border: 1px solid var(--gray-200); border-radius: 16px;
      padding: 22px; box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }
    .breakdown-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--gray-400); margin-bottom: 16px; }
    .breakdown-row { margin-bottom: 14px; }
    .breakdown-label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .bar-bg { background: var(--gray-100); border-radius: 99px; height: 7px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; transition: width .8s cubic-bezier(.4,0,.2,1); }

    /* ── Review ── */
    .review-container { background: #fff; border: 1px solid var(--gray-200); border-radius: 20px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.05); animation: fadeUp .5s ease-out .2s backwards; }
    .review-header-bar {
      padding: 20px 24px; border-bottom: 1px solid var(--gray-100);
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    }
    .review-title { font-size: 16px; font-weight: 800; color: var(--gray-900); }
    .review-count { font-size: 13px; color: var(--gray-400); font-weight: 400; }

    .filter-bar { display: flex; gap: 6px; padding: 16px 24px; border-bottom: 1px solid var(--gray-100); flex-wrap: wrap; }
    .filter-btn {
      padding: 7px 16px; border-radius: 99px; font-size: 13px; font-weight: 600;
      border: 1.5px solid var(--gray-200); background: #fff; cursor: pointer;
      transition: all .15s; color: var(--gray-600); font-family: var(--font);
    }
    .filter-btn:hover { border-color: var(--blue); color: var(--blue); }
    .filter-btn.active-all       { background: var(--gray-900); border-color: var(--gray-900); color: #fff; }
    .filter-btn.active-correct   { background: var(--green);    border-color: var(--green);    color: #fff; }
    .filter-btn.active-incorrect { background: var(--red);      border-color: var(--red);      color: #fff; }
    .filter-btn.active-unanswered{ background: var(--gray-500); border-color: var(--gray-500); color: #fff; }

    .review-list { padding: 16px 24px; display: flex; flex-direction: column; gap: 12px; }

    /* ── Individual review item ── */
    .review-item {
      border: 1px solid var(--gray-200); border-left: 5px solid var(--gray-300);
      border-radius: 14px; padding: 20px; background: #fff;
      transition: box-shadow .2s; animation: fadeUp .3s ease-out backwards;
    }
    .review-item:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    .review-item.correct   { border-left-color: var(--green); }
    .review-item.incorrect { border-left-color: var(--red); }
    .review-item.unanswered { border-left-color: var(--gray-300); }

    .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; gap: 12px; }
    .item-q-num { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--gray-400); margin-bottom: 2px; }
    .item-word { font-size: 18px; font-weight: 800; color: var(--blue); }
    .item-word.math { font-size: 15px; color: var(--gray-800); font-weight: 600; }
    .item-badges { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
    .chip { display: inline-flex; align-items: center; gap: 3px; padding: 3px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; }
    .chip-green  { background: var(--green-bg); color: var(--green); }
    .chip-red    { background: var(--red-bg);   color: var(--red); }
    .chip-gray   { background: var(--gray-100); color: var(--gray-500); }
    .chip-orange { background: var(--orange-bg);color: var(--orange); }
    .chip-blue   { background: var(--blue-light);color: var(--blue); }

    .passage-box {
      background: var(--gray-50); border-left: 3px solid var(--gray-300);
      border-radius: 0 10px 10px 0; padding: 12px 16px; margin-bottom: 12px;
      font-size: 13px; color: var(--gray-600); font-style: italic; line-height: 1.6;
    }
    .question-text {
      font-size: 15px; color: var(--gray-800); margin-bottom: 16px; line-height: 1.6; font-weight: 500;
    }

    /* Options grid */
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .option-pill {
      padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--gray-200);
      background: var(--gray-50); display: flex; align-items: center; gap: 10px;
      font-size: 13px; line-height: 1.4;
    }
    .opt-letter {
      width: 24px; height: 24px; border-radius: 50%; background: var(--gray-200);
      color: var(--gray-700); font-weight: 700; font-size: 12px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .opt-tag { margin-left: auto; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .option-pill.correct-opt { background: var(--green-bg); border-color: var(--green); }
    .option-pill.correct-opt .opt-letter { background: var(--green); color: #fff; }
    .option-pill.correct-opt .opt-tag { color: var(--green); }
    .option-pill.wrong-opt { background: var(--red-bg); border-color: var(--red); }
    .option-pill.wrong-opt .opt-letter { background: var(--red); color: #fff; }
    .option-pill.wrong-opt .opt-tag { color: var(--red); }

    /* Grid-in answer display */
    .gridin-row { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; font-size: 14px; flex-wrap: wrap; }
    .gridin-answer { padding: 8px 16px; border-radius: 8px; font-size: 15px; font-weight: 700; }
    .gridin-answer.user-wrong { background: var(--red-bg); border: 1.5px solid var(--red); color: var(--red); }
    .gridin-answer.user-correct { background: var(--green-bg); border: 1.5px solid var(--green); color: var(--green); }
    .gridin-answer.correct-ans { background: var(--green-bg); border: 1.5px solid var(--green); color: var(--green); }
    .gridin-answer.skipped { background: var(--gray-100); border: 1.5px solid var(--gray-300); color: var(--gray-500); }

    /* Explanation */
    .explanation-box {
      background: linear-gradient(135deg, #eef2ff, #f5f3ff);
      border: 1px solid #ddd6fe; border-radius: 10px; padding: 14px 16px;
      font-size: 13px; color: var(--gray-700); line-height: 1.65;
    }
    .exp-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--blue); margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }

    /* Empty state */
    .empty-state { text-align: center; padding: 56px; color: var(--gray-400); }
    .empty-icon { font-size: 44px; margin-bottom: 10px; }

    /* Loading skeleton */
    .skeleton { background: linear-gradient(90deg,var(--gray-100) 25%,var(--gray-200) 50%,var(--gray-100) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }

    @media(max-width:700px) {
      .hero-inner { flex-direction:column; }
      .hero-actions { flex-direction:row; flex-wrap:wrap; }
      .stats-row { grid-template-columns:1fr 1fr 1fr; }
      .breakdown-grid { grid-template-columns:1fr; }
      .options-grid { grid-template-columns:1fr; }
      .topnav { padding:0 16px; }
      .page { padding:20px 16px 60px; }
    }
  </style>
</head>
<body>

<nav class="topnav">
  <div class="nav-logo">
    <div class="nav-logo-icon">🎓</div>
    <div class="nav-logo-text">SAT Platform</div>
  </div>
  <div class="nav-right">
    <span class="nav-user" id="nav-name"></span>
    <a href="/student/dashboard.html" class="btn-back">← Dashboard</a>
  </div>
</nav>

<div class="page" id="main-content">
  <!-- Loading state -->
  <div class="skeleton" style="height:240px;border-radius:20px;margin-bottom:24px"></div>
  <div class="skeleton" style="height:90px;border-radius:16px;margin-bottom:20px"></div>
  <div class="skeleton" style="height:160px;border-radius:16px"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const attemptId = params.get('attemptId');
if (!attemptId) location.href = '/student/dashboard.html';

let allReview = [];
let currentFilter = 'all';

async function init() {
  try {
    const me = await fetch('/api/auth/me').then(r => r.json());
    if (!me.authenticated || me.user.role !== 'student') { location.href = '/'; return; }
    document.getElementById('nav-name').textContent = me.user.name;

    const r = await fetch(`/api/student/attempt/${attemptId}/result`);
    const d = await r.json();
    if (!r.ok) {
      document.getElementById('main-content').innerHTML = `<div style="background:var(--red-bg);color:var(--red);border:1px solid #fca5a5;border-radius:12px;padding:16px;margin-top:12px">${d.error || 'Could not load results.'}</div>`;
      return;
    }
    allReview = d.review || [];
    renderResults(d.result, d.attempt, d.review, d.result.nextAttemptId);
  } catch(e) {
    console.error(e);
    document.getElementById('main-content').innerHTML = `<div style="background:var(--red-bg);color:var(--red);border:1px solid #fca5a5;border-radius:12px;padding:16px">Failed to load results. Please try again.</div>`;
  }
}

function getGrade(acc) {
  if (acc >= 90) return { letter:'A', color:'#059669' };
  if (acc >= 80) return { letter:'B', color:'#4f46e5' };
  if (acc >= 70) return { letter:'C', color:'#d97706' };
  if (acc >= 60) return { letter:'D', color:'#f97316' };
  return { letter:'F', color:'#dc2626' };
}

function renderResults(result, attempt, review, nextAttemptId) {
  const grade = getGrade(result.accuracy);
  const total = (result.correct_count||0) + (result.incorrect_count||0) + (result.unanswered_count||0);

  const typeNames = {
    'definition':'Definitions', 'isolated-word':'Word Knowledge',
    'passage-in-context':'Passage Context',
    'math-multiple-choice':'Math (MCQ)', 'math-grid-in':'Math (Grid-In)',
    'math-module-1':'Module 1','math-module-2':'Module 2'
  };
  const diffColors = {
    easy:'linear-gradient(90deg,#059669,#34d399)',
    medium:'linear-gradient(90deg,#d97706,#fbbf24)',
    hard:'linear-gradient(90deg,#dc2626,#f87171)'
  };

  const html = `
    <!-- Hero -->
    <div class="score-hero">
      <div class="hero-inner">
        <div class="hero-left">
          <div class="test-label">Test Complete</div>
          <div class="test-name">${attempt.testTitle || attempt.title || 'Test Results'}</div>
          <div class="meta-row">
            <span>📅 ${fmtDate(result.submittedAt || attempt.submittedAt)}</span>
            <span>⏱ ${fmtTime(result.time_used)}</span>
          </div>
        </div>
        <div class="hero-center">
          <div class="score-ring">
            <div class="score-num">${result.correct_count}</div>
            <div class="score-denom">/ ${total}</div>
          </div>
          <div class="accuracy-text">${result.accuracy}% Accuracy</div>
          <div class="grade-badge">Grade: ${grade.letter}</div>
        </div>
        <div class="hero-actions">
          <a href="/student/dashboard.html" class="btn-hero btn-hero-outline">← Dashboard</a>
          ${nextAttemptId
            ? `<a href="/student/test.html?attemptId=${nextAttemptId}" class="btn-hero btn-hero-white">Second Pass →</a>`
            : `<a href="/student/test.html?testId=${attempt.test_id || ''}" class="btn-hero btn-hero-white">Retake Test</a>`}
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card correct">
        <div class="stat-val" style="color:var(--green)">${result.correct_count}</div>
        <div class="stat-lbl">✓ Correct</div>
      </div>
      <div class="stat-card incorrect">
        <div class="stat-val" style="color:var(--red)">${result.incorrect_count}</div>
        <div class="stat-lbl">✗ Incorrect</div>
      </div>
      <div class="stat-card skipped">
        <div class="stat-val" style="color:var(--gray-400)">${result.unanswered_count}</div>
        <div class="stat-lbl">— Skipped</div>
      </div>
    </div>

    <!-- Breakdown -->
    <div class="breakdown-grid">
      <div class="breakdown-card">
        <div class="breakdown-title">By Section / Type</div>
        ${renderBreakdown(result.questionTypeBreakdown, typeNames, 'linear-gradient(90deg,var(--blue),var(--purple))')}
      </div>
      <div class="breakdown-card">
        <div class="breakdown-title">By Difficulty</div>
        ${renderBreakdown(result.difficultyBreakdown, {easy:'Easy',medium:'Medium',hard:'Hard'}, null, diffColors)}
      </div>
    </div>

    <!-- Review -->
    ${nextAttemptId ? `
    <div style="background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #fde68a;border-radius:14px;padding:20px 24px">
      <div style="font-size:15px;font-weight:700;color:#92400e;margin-bottom:6px">⚡ Second Pass Required</div>
      <div style="font-size:13px;color:#a16207;margin-bottom:14px">You missed some questions. Complete the second pass to see detailed explanations and correct answers.</div>
      <a href="/student/test.html?attemptId=${nextAttemptId}" class="btn-hero btn-hero-white" style="display:inline-flex;color:var(--orange)">Start Second Pass →</a>
    </div>`
    : review ? `
    <div class="review-container">
      <div class="review-header-bar">
        <div>
          <div class="review-title">📋 Answer Review <span class="review-count">(${review.length} questions)</span></div>
        </div>
      </div>
      <div class="filter-bar">
        <button class="filter-btn active-all" id="fb-all"      onclick="setFilter('all')">All (${review.length})</button>
        <button class="filter-btn"            id="fb-correct"  onclick="setFilter('correct')">✓ Correct (${review.filter(x=>x.is_correct===1).length})</button>
        <button class="filter-btn"            id="fb-incorrect"onclick="setFilter('incorrect')">✗ Incorrect (${review.filter(x=>x.is_correct===0&&!!x.selected_answer).length})</button>
        <button class="filter-btn"            id="fb-unanswered"onclick="setFilter('unanswered')">— Skipped (${review.filter(x=>!x.selected_answer).length})</button>
      </div>
      <div class="review-list" id="review-list"></div>
    </div>`
    : `<div style="background:var(--blue-light);border:1px solid #c3d9ff;border-radius:12px;padding:16px;color:#1e3a8a;font-size:14px">Detailed review is not enabled for this test.</div>`}
  `;

  document.getElementById('main-content').innerHTML = html;

  if (review && review.length > 0) {
    renderReviewList();
  }
}

function setFilter(f) {
  currentFilter = f;
  // Reset all
  ['all','correct','incorrect','unanswered'].forEach(k => {
    const btn = document.getElementById('fb-'+k);
    if (btn) {
      btn.className = `filter-btn${f===k ? ' active-'+k : ''}`;
    }
  });
  renderReviewList();
}

function renderReviewList() {
  const filtered = allReview.filter(item => {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'correct') return item.is_correct === 1;
    if (currentFilter === 'incorrect') return item.is_correct === 0 && !!item.selected_answer;
    if (currentFilter === 'unanswered') return !item.selected_answer;
    return true;
  });

  const listEl = document.getElementById('review-list');
  if (!listEl) return;

  if (!filtered.length) {
    listEl.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div>No questions match this filter.</div></div>`;
    return;
  }

  const isMath = allReview.some(i => i.question_type && i.question_type.startsWith('math'));

  listEl.innerHTML = filtered.map((item, i) => {
    const status = item.is_correct === 1 ? 'correct' : item.selected_answer ? 'incorrect' : 'unanswered';
    const badgeCls = {correct:'chip-green', incorrect:'chip-red', unanswered:'chip-gray'}[status];
    const statusIcon = {correct:'✓ Correct', incorrect:'✗ Incorrect', unanswered:'— Skipped'}[status];
    const opts = typeof item.options === 'string' ? JSON.parse(item.options) : (item.options || []);
    const letters = ['A','B','C','D'];
    const diffCls = {easy:'chip-green',medium:'chip-orange',hard:'chip-red'}[item.difficulty] || 'chip-gray';

    // Determine the display label for header
    const isGridIn = item.question_type === 'math-grid-in';
    const displayLabel = isMath
      ? `Q${i+1}`
      : (item.word || `Q${i+1}`);

    // Options OR grid-in
    let answersHtml = '';
    if (isGridIn) {
      const userAns = item.selected_answer;
      const correctAns = item.correct_answer;
      const isCorrect = item.is_correct === 1;
      answersHtml = `<div class="gridin-row">
        <span style="font-weight:600;color:var(--gray-600)">Your answer:</span>
        <span class="gridin-answer ${!userAns ? 'skipped' : isCorrect ? 'user-correct' : 'user-wrong'}">${userAns || 'Not answered'}</span>
        ${!isCorrect ? `<span style="font-weight:600;color:var(--gray-600)">Correct:</span><span class="gridin-answer correct-ans">${correctAns}</span>` : ''}
      </div>`;
    } else if (opts.length > 0) {
      const pillsHtml = opts.map((opt, idx) => {
        const letter = letters[idx];
        const isCorrectOpt = letter === item.correct_answer;
        const isWrong = letter === item.selected_answer && !isCorrectOpt;
        return `<div class="option-pill ${isCorrectOpt?'correct-opt':''} ${isWrong?'wrong-opt':''}">
          <span class="opt-letter">${letter}</span>
          <span>${opt}</span>
          ${isCorrectOpt ? '<span class="opt-tag" style="color:var(--green)">✓ Correct</span>' : ''}
          ${isWrong      ? '<span class="opt-tag" style="color:var(--red)">Your answer</span>' : ''}
        </div>`;
      }).join('');
      answersHtml = `<div class="options-grid">${pillsHtml}</div>`;
    } else {
      // No options (shouldn't normally happen)
      answersHtml = `<div class="gridin-row">
        <span style="color:var(--gray-600)">Your answer: <strong>${item.selected_answer || '—'}</strong></span>
        <span style="color:var(--gray-600)">Correct: <strong style="color:var(--green)">${item.correct_answer}</strong></span>
      </div>`;
    }

    return `<div class="review-item ${status}" style="animation-delay:${i*0.04}s">
      <div class="item-header">
        <div>
          <div class="item-q-num">Q${i+1}</div>
          <div class="item-word ${isMath?'math':''}">${isMath ? '' : (displayLabel || '')}</div>
        </div>
        <div class="item-badges">
          <span class="chip ${diffCls}">${item.difficulty || ''}</span>
          <span class="chip ${badgeCls}">${statusIcon}</span>
        </div>
      </div>
      ${item.context ? `<div class="passage-box">"${item.context}"</div>` : ''}
      <div class="question-text">${item.question}</div>
      ${answersHtml}
      ${item.explanation ? `
      <div class="explanation-box">
        <div class="exp-label">💡 Explanation</div>
        ${item.explanation}
      </div>` : ''}
    </div>`;
  }).join('');

  // Trigger MathJax re-render after DOM update
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise([listEl]).catch(err => console.warn('MathJax error:', err));
  }
}

function renderBreakdown(breakdown, names, defaultGradient, colorMap) {
  if (!breakdown || !Object.keys(breakdown).length) return '<p style="color:var(--gray-400);font-size:13px">No data available.</p>';
  return Object.entries(breakdown).map(([key, counts]) => {
    const total = (counts.correct||0) + (counts.incorrect||0) + (counts.unanswered||0);
    const pct = total > 0 ? Math.round((counts.correct||0) / total * 100) : 0;
    const gradient = (colorMap && colorMap[key]) ? colorMap[key] : defaultGradient;
    return `<div class="breakdown-row">
      <div class="breakdown-label">
        <span style="font-weight:500">${names[key] || key}</span>
        <span><strong>${counts.correct||0}/${total}</strong> <span style="color:var(--gray-400)">${pct}%</span></span>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${gradient}"></div></div>
    </div>`;
  }).join('');
}

function fmtTime(s) {
  if (!s) return '—';
  const m = Math.floor(s/60), sec = s%60;
  return `${m}m ${String(sec).padStart(2,'0')}s`;
}
function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

init();
</script>

</html>
