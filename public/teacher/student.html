<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Detail — SAT Platform</title>
  <link rel="stylesheet" href="/assets/css/main.css" />
  <style>
    .profile-header { display:flex; align-items:center; gap:20px; margin-bottom:24px; }
    .profile-avatar { width:64px; height:64px; background:var(--blue-light); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:700; color:var(--blue); flex-shrink:0; }
    .profile-info h1 { font-size:22px; font-weight:700; margin-bottom:4px; }
    .profile-meta { display:flex; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--gray-500); }
    .attempt-card { background:#fff; border:1px solid var(--gray-200); border-radius:10px; padding:20px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; transition:all .15s; }
    .attempt-card:hover { border-color:var(--blue); box-shadow:var(--shadow); }
    .attempt-left h3 { font-size:15px; font-weight:600; margin-bottom:4px; }
    .attempt-left .meta { font-size:13px; color:var(--gray-500); }
    .attempt-right { text-align:right; }
    .attempt-score { font-size:20px; font-weight:700; color:var(--blue); }
    .integrity-badge { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:99px; font-size:11px; font-weight:600; }
    /* Sparkline chart */
    .chart-wrap { background:#fff; border:1px solid var(--gray-200); border-radius:10px; padding:20px; margin-bottom:20px; }
    .chart-svg-wrap { overflow-x:auto; }
    svg text { font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
<nav class="topnav">
  <span class="logo">🎓 SAT Platform — Teacher</span>
  <div class="user-info">
    <a href="/teacher/dashboard.html" class="btn btn-ghost btn-sm">← Dashboard</a>
    <a href="/teacher/questions.html" class="btn btn-ghost btn-sm">Question Bank</a>
    <button class="btn btn-ghost btn-sm" onclick="logout()">Sign Out</button>
  </div>
</nav>

<div class="container page-wrap" id="main-content">
  <div style="text-align:center;padding:60px;color:var(--gray-500)">Loading…</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const studentId = params.get('studentId');
if (!studentId) location.href = '/teacher/dashboard.html';

async function init() {
  const me = await fetch('/api/auth/me').then(r => r.json());
  if (!me.authenticated || me.user.role !== 'teacher') { location.href='/'; return; }

  const r = await fetch(`/api/teacher/students/${studentId}`);
  const d = await r.json();
  if (!r.ok) { document.getElementById('main-content').innerHTML = '<div class="alert alert-error">Student not found</div>'; return; }

  render(d.student, d.attempts);
}

function render(student, attempts) {
  const initials = student.name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  const scores = attempts.map(a => a.accuracy || 0);

  let html = `
    <div class="profile-header">
      <div class="profile-avatar">${initials}</div>
      <div class="profile-info">
        <h1>${student.name}</h1>
        <div class="profile-meta">
          ${student.username ? `<span>@${student.username}</span>` : ''}
          ${student.student_id ? `<span class="badge badge-blue">${student.student_id}</span>` : ''}
          <span>${student.email}</span>
          <span>Joined ${fmtDate(student.created_at)}</span>
        </div>
      </div>
    </div>`;

  // Progress chart
  if (attempts.length > 1) {
    html += `<div class="chart-wrap">
      <div style="font-size:14px;font-weight:600;margin-bottom:16px">📈 Progress — Accuracy Over Time</div>
      <div class="chart-svg-wrap">${buildChart(attempts)}</div>
    </div>`;
  }

  // Summary table
  html += `<div class="card mb-2">
    <div class="card-title">Test History (${attempts.length} attempt${attempts.length!==1?'s':''})</div>`;

  if (!attempts.length) {
    html += `<div class="empty-state" style="padding:32px;text-align:center;color:var(--gray-500)">No completed tests yet.</div>`;
  } else {
    html += `<div class="table-wrap"><table>
      <thead><tr><th>#</th><th>Test</th><th>Score</th><th>Correct</th><th>Wrong</th><th>Unanswered</th><th>Accuracy</th><th>Time</th><th>Date</th><th>Integrity</th><th></th></tr></thead>
      <tbody>`;
    attempts.forEach((a, i) => {
      const integrityCls = a.integrityEvents === 0 ? 'badge-green' : a.integrityEvents <= 2 ? 'badge-orange' : 'badge-red';
      html += `<tr style="cursor:pointer" onclick="location.href='/teacher/attempt.html?attemptId=${a.id}'">
        <td>${i+1}</td>
        <td>${a.title}</td>
        <td><strong>${a.score ?? '—'}/40</strong></td>
        <td style="color:var(--green)">${a.correct_count ?? '—'}</td>
        <td style="color:var(--red)">${a.incorrect_count ?? '—'}</td>
        <td style="color:var(--gray-500)">${a.unanswered_count ?? '—'}</td>
        <td>${a.accuracy != null ? `<strong>${a.accuracy}%</strong>` : '—'}</td>
        <td>${a.time_used != null ? fmtTime(a.time_used) : '—'}</td>
        <td>${fmtDate(a.submitted_at)}</td>
        <td><span class="badge ${integrityCls}">${a.integrityEvents} event${a.integrityEvents!==1?'s':''}</span></td>
        <td><a href="/teacher/attempt.html?attemptId=${a.id}" class="btn btn-ghost btn-sm" onclick="event.stopPropagation()">Review</a></td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }
  html += `</div>`;

  document.getElementById('main-content').innerHTML = html;
}

function buildChart(attempts) {
  const W = Math.max(600, attempts.length * 80);
  const H = 180;
  const PAD = { top: 20, right: 20, bottom: 40, left: 40 };
  const cw = W - PAD.left - PAD.right;
  const ch = H - PAD.top - PAD.bottom;

  const points = attempts.map((a, i) => ({
    x: PAD.left + (attempts.length === 1 ? cw/2 : i * cw / (attempts.length - 1)),
    y: PAD.top + ch - (a.accuracy / 100) * ch,
    acc: a.accuracy,
    date: fmtDate(a.submitted_at)
  }));

  const pathD = points.map((p, i) => `${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const areaD = pathD + ` L${points[points.length-1].x.toFixed(1)},${(PAD.top+ch).toFixed(1)} L${points[0].x.toFixed(1)},${(PAD.top+ch).toFixed(1)} Z`;

  // Grid lines at 25, 50, 75, 100
  let grid = '';
  [0,25,50,75,100].forEach(v => {
    const y = PAD.top + ch - (v/100)*ch;
    grid += `<line x1="${PAD.left}" y1="${y.toFixed(1)}" x2="${PAD.left+cw}" y2="${y.toFixed(1)}" stroke="#e5e7eb" stroke-width="1"/>
    <text x="${PAD.left-6}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10" fill="#9ca3af">${v}%</text>`;
  });

  const circles = points.map(p => `
    <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5" fill="#1a56db" stroke="#fff" stroke-width="2">
      <title>${p.date}: ${p.acc}%</title>
    </circle>
    <text x="${p.x.toFixed(1)}" y="${(p.y-10).toFixed(1)}" text-anchor="middle" font-size="10" fill="#374151" font-weight="600">${p.acc}%</text>
    <text x="${p.x.toFixed(1)}" y="${(H-8).toFixed(1)}" text-anchor="middle" font-size="9" fill="#9ca3af">${p.date}</text>`).join('');

  return `<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">
    ${grid}
    <path d="${areaD}" fill="rgba(26,86,219,0.07)"/>
    <path d="${pathD}" fill="none" stroke="#1a56db" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${circles}
  </svg>`;
}

function fmtTime(s) { return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
function fmtDate(iso) { if (!iso) return '—'; return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
async function logout() { await fetch('/api/auth/logout',{method:'POST'}); location.href='/'; }

init();
</script>
</body>
</html>
